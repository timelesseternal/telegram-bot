<!-- Кнопки дней недели -->
<div class="days-tabs">
  <button class="day-btn active" onclick="selectDay('Понедельник', this)">ПН</button>
  <button class="day-btn" onclick="selectDay('Вторник', this)">ВТ</button>
  <button class="day-btn" onclick="selectDay('Среда', this)">СР</button>
  <button class="day-btn" onclick="selectDay('Четверг', this)">ЧТ</button>
  <button class="day-btn" onclick="selectDay('Пятница', this)">ПТ</button>
  <button class="day-btn" onclick="selectDay('Суббота', this)">СБ</button>
</div>

<div id="schedule"></div>

<script>
  async function selectDay(dayName, btn) {
    // Подсветка активной кнопки
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

    const container = document.getElementById('schedule');
    container.innerHTML = '<div style="text-align: center; margin-top: 20px;">Загрузка...</div>';

    try {
      // Адрес твоей запущенной ссылки ngrok с флагом обхода заставки
      const response = await fetch(`https://nickname-crib-feel.ngrok-free.dev/api/schedule/${encodeURIComponent(dayName)}?ngrok-skip-browser-warning=true`);
      
      if (!response.ok) {
        throw new Error(`Ошибка сервера: ${response.status}`);
      }

      const items = await response.json();

      if (!items || items.length === 0) {
        container.innerHTML = '<div style="color: var(--hint-color); text-align: center; margin-top: 20px;">Пар нет! 🎉</div>';
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="card">
          <div class="time-box">
            <span class="num">${item.num}</span>
          </div>
          <div class="info">
            <div class="title">${item.title} <span class="badge">${item.type}</span></div>
            <div class="meta">🚪 ${item.room} • 👨‍🏫 ${item.teacher}</div>
          </div>
        </div>
      `).join('');

    } catch (error) {
      console.error('Ошибка:', error);
      container.innerHTML = '<div style="color: red; text-align: center; margin-top: 20px;">Ошибка загрузки расписания</div>';
    }
  }

  // При старте автоматически загружаем Понедельник
  document.addEventListener('DOMContentLoaded', () => {
    selectDay('Понедельник', document.querySelector('.day-btn.active'));
  });
</script>
