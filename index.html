<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Univer</title>

  <meta name="theme-color" content="#0066cc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #555555;
      --accent: #0066cc;
      --accent-text: #ffffff;
      --border-color: rgba(0, 0, 0, 0.08);
      --badge-bg: #f1f3f5;
    }

    [data-theme="dark"] {
      --bg-color: #0f1012;
      --card-bg: #18191c;
      --text-main: #f1f3f5;
      --text-muted: #9ba1a6;
      --accent: #3388ff;
      --accent-text: #ffffff;
      --border-color: rgba(255, 255, 255, 0.08);
      --badge-bg: #222428;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    .app-wrapper {
      padding: 12px;
      box-sizing: border-box;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .status-bar {
      background: var(--card-bg);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      width: 100%;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-muted);
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--accent) !important;
      color: var(--accent-text) !important;
      border-color: var(--accent) !important;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }

    .day-btn {
      padding: 10px 0;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
    }

    .day-btn.active {
      background: var(--accent) !important;
      color: var(--accent-text) !important;
      border-color: var(--accent) !important;
    }

    .card {
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      background: var(--card-bg);
      color: var(--text-main);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .para-num {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .time-badge {
      font-size: 0.78rem;
      background: var(--badge-bg);
      padding: 4px 8px;
      border-radius: 8px;
      color: var(--text-muted);
    }

    .subject-title {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 8px;
    }

    .meta-info {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .meta-info div {
      margin-top: 4px;
    }

    .meta-info strong {
      color: var(--text-main);
    }

    .badge-type {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .type-1 { color: var(--accent); border: 1px solid var(--accent); }
    .type-2 { color: #9333ea; border: 1px solid #9333ea; }
    .type-0 { color: #16a34a; border: 1px solid #16a34a; }

    .umkd-subject-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .umkd-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--badge-bg);
      border-radius: 10px;
      margin-top: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      border: 1px solid var(--border-color);
    }

    .back-btn {
      background: var(--badge-bg);
      border: none;
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .empty-state {
      text-align: center;
      padding: 40px 10px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

<div class="app-wrapper">
  <div class="container">
    <div class="status-bar">
      <span id="weekStatusText">Расписание занятий</span>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" id="tabCurrent" onclick="switchWeek('current')">Расписание</button>
      <button class="tab-btn" id="tabExams" onclick="switchWeek('exams')">Экзамены</button>
      <button class="tab-btn" id="tabUmkd" onclick="switchWeek('umkd')">УМКД</button>
    </div>

    <div class="days-grid" id="daysGrid">
      <button class="day-btn active" onclick="selectDay('Понедельник', this)">ПН</button>
      <button class="day-btn" onclick="selectDay('Вторник', this)">ВТ</button>
      <button class="day-btn" onclick="selectDay('Среда', this)">СР</button>
      <button class="day-btn" onclick="selectDay('Четверг', this)">ЧТ</button>
    </div>

    <div id="scheduleContainer"></div>
  </div>
</div>

<script>
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.colorScheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
    if (tg.setHeaderColor) tg.setHeaderColor('bg_color');
  }

  const SCHEDULE = {
    'Понедельник': [
      {'пара': '1', 'sub': 'Политология (Сем)', 'teacher': 'Толеуова М. Ө.', 'room': '1к232', 'type': 2},
      {'пара': '2', 'sub': 'Физкультура (Сем)', 'teacher': 'Окасов Е. А.', 'room': 'Спорт', 'type': 0},
      {'пара': '3', 'sub': 'Комп. графика (Лек)', 'teacher': 'Коккоз М. М.', 'room': 'Гк430', 'type': 1},
      {'пара': '4', 'sub': 'Теор. вероятностей (Лаб)', 'teacher': 'Бекмагамбетова Э. К.', 'room': '1к304', 'type': 1}
    ],
    'Вторник': [
      {'пара': '1', 'sub': 'Политология (Лек)', 'teacher': 'Казбеков Н. А.', 'room': '1к209', 'type': 1},
      {'пара': '2', 'sub': 'Комп. графика (Лаб)', 'teacher': 'Тапенова Г. С.', 'room': 'Гк400', 'type': 0}
    ],
    'Среда': [
      {'пара': '1', 'sub': 'ООП Python (Лек)', 'teacher': 'Аубакирова А. Е.', 'room': 'Гк434', 'type': 0},
      {'пара': '2', 'sub': 'Базы данных (Лек)', 'teacher': 'Кәмен Е. Ғ.', 'room': 'Гк422', 'type': 2},
      {'пара': '3', 'sub': 'ООП Python (Лаб)', 'teacher': 'Аубакирова А. Е.', 'room': 'Гк422', 'type': 0}
    ],
    'Четверг': [
      {'пара': '1', 'sub': 'Физкультура (Сем)', 'teacher': 'Окасов Е. А.', 'room': 'Спорт', 'type': 0},
      {'пара': '2', 'sub': 'Базы данных (Лаб)', 'teacher': 'Кәмен Е. Ғ.', 'room': 'Гк400', 'type': 0},
      {'пара': '3', 'sub': 'ООП Python (Лаб)', 'teacher': 'Аубакирова А. Е.', 'room': 'Гк430', 'type': 2}
    ]
  };

  const EXAMS = [
    { date: '12 мая', time: '09:00', sub: 'Компьютерная графика', teacher: 'Коккоз М. М.', room: 'Гк422б' },
    { date: '15 мая', time: '09:00', sub: 'Психология / Политология', teacher: 'Курымбаева С. К.', room: '1к232' },
    { date: '18 мая', time: '09:00', sub: 'Введение в базы данных', teacher: 'Кәмен Е. Ғ.', room: 'Гк421' },
    { date: '21 мая', time: '09:00', sub: 'Теор. вер. и мат. стат.', teacher: 'Бекмагамбетова Э. К.', room: '1к312' }
  ];

  const UMKD_FILES = {
    'Базы данных': [{ name: '📄 Лекционный материал', url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf' }],
    'Комп. графика': [{ name: '📄 Конспект лекций', url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf' }],
    'Политология': [{ name: '📄 Учебное пособие', url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf' }],
    'ООП Python': [{ name: '📄 Методичка', url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf' }]
  };

  let currentTab = 'current';
  let selectedDayName = 'Понедельник';

  function switchWeek(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    if (tab === 'current') document.getElementById('tabCurrent').classList.add('active');
    if (tab === 'exams') document.getElementById('tabExams').classList.add('active');
    if (tab === 'umkd') document.getElementById('tabUmkd').classList.add('active');

    document.getElementById('daysGrid').style.display = (tab === 'current') ? 'grid' : 'none';
    renderSchedule();
  }

  function selectDay(dayName, btn) {
    selectedDayName = dayName;
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    renderSchedule();
  }

  function renderSchedule() {
    const container = document.getElementById('scheduleContainer');
    container.innerHTML = '';

    if (currentTab === 'exams') {
      EXAMS.forEach(ex => {
        container.innerHTML += `
          <div class="card">
            <div class="card-header">
              <span class="para-num">${ex.sub}</span>
              <span class="time-badge">${ex.date} | ${ex.time}</span>
            </div>
            <div class="meta-info">
              Преподаватель: <strong>${ex.teacher}</strong>
              <div>Аудитория: <strong>${ex.room}</strong></div>
            </div>
            <span class="badge-type type-1">Экзамен</span>
          </div>`;
      });
      return;
    }

    if (currentTab === 'umkd') {
      Object.keys(UMKD_FILES).forEach(sub => {
        const card = document.createElement('div');
        card.className = 'umkd-subject-card';
        card.innerHTML = `<span>📚 ${sub}</span> <span>📁</span>`;
        card.onclick = () => {
          container.innerHTML = `<button class="back-btn" onclick="switchWeek('umkd')">← Назад</button><div style="margin-top:10px;font-weight:700;">${sub}</div>`;
          UMKD_FILES[sub].forEach(file => {
            container.innerHTML += `<div class="umkd-item" onclick="window.open('${file.url}', '_blank')"><span>${file.name}</span><span>↗</span></div>`;
          });
        };
        container.appendChild(card);
      });
      return;
    }

    const lessons = SCHEDULE[selectedDayName] || [];
    if (lessons.length === 0) {
      container.innerHTML = '<div class="empty-state">В этот день пар нет 🎉</div>';
      return;
    }

    lessons.forEach(l => {
      const typeText = l.type === 1 ? 'Лекция' : l.type === 2 ? 'Практика / Семинар' : 'Лабораторная';
      container.innerHTML += `
        <div class="card">
          <div class="card-header">
            <span class="para-num">Пара ${l.пара}</span>
            <span class="time-badge">${l.room}</span>
          </div>
          <div class="subject-title">${l.sub}</div>
          <div class="meta-info">Преподаватель: <strong>${l.teacher}</strong></div>
          <span class="badge-type type-${l.type}">${typeText}</span>
        </div>`;
    });
  }

  renderSchedule();
</script>
</body>
</html>
