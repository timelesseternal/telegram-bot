<!-- Кнопки дней недели -->
<div class="days-tabs">
  <button class="day-btn active" onclick="selectDay('Понедельник', this)">ПН</button>
  <button class="day-btn" onclick="selectDay('Вторник', this)">ВТ</button>
  <button class="day-btn" onclick="selectDay('Среда', this)">СР</button>
  <button class="day-btn" onclick="selectDay('Четверг', this)">ЧТ</button>
  <button class="day-btn" onclick="selectDay('Пятница', this)">ПТ</button>
  <button class="day-btn" onclick="selectDay('Суббота', this)">СБ</button>
</div>

<div id="schedule"></div>

<script>
  async function selectDay(dayName, btn) {
    // Подсветка активной кнопки
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

    const container = document.getElementById('schedule');
    container.innerHTML = '<div style="text-align: center; margin-top: 20px;">Загрузка расписания...</div>';

    try {
      const url = `https://nickname-crib-feel.ngrok-free.dev/api/schedule/${encodeURIComponent(dayName)}?ngrok-skip-browser-warning=69420`;
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`Ошибка HTTP: ${response.status}`);
      }

      const items = await response.json();

      if (!Array.isArray(items) || items.length === 0) {
        container.innerHTML = '<div style="color: #888; text-align: center; margin-top: 20px;">Пар нет! 🎉</div>';
        return;
      }

      let htmlContent = '';
      
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        
        let badgeStyle = "background: #e0e0e0; color: #333;";
        let typeText = item.type || "Занятие";

        if (typeText.includes("числ")) {
          typeText = "⚡ Числитель";
          badgeStyle = "background: #e3f2fd; color: #1565c0;";
        } else if (typeText.includes("знам")) {
          typeText = "🌙 Знаменатель";
          badgeStyle = "background: #f3e5f5; color: #7b1fa2;";
        } else if (typeText.includes("всег")) {
          typeText = "🔄 Каждую неделю";
          badgeStyle = "background: #e8f5e9; color: #2e7d32;";
        }

        htmlContent += `
          <div class="card" style="border: 1px solid #e0e0e0; padding: 14px; margin-bottom: 12px; border-radius: 10px; background: #fff;">
            <div class="time-box" style="display: flex; justify-content: space-between; align-items: center;">
              <strong style="font-size: 1.1em; color: #111;">Пара №${item.num}</strong>
              <span style="${badgeStyle} padding: 4px 8px; border-radius: 6px; font-size: 0.85em; font-weight: 600;">
                ${typeText}
              </span>
            </div>
            <div class="info" style="margin-top: 8px;">
              <div class="title" style="font-weight: bold; font-size: 1.05em; color: #222;">
                ${item.title}
              </div>
              <div class="meta" style="color: #666; font-size: 0.9em; margin-top: 6px;">
                🚪 Аудитория: <strong>${item.room}</strong> • 👨‍🏫 ${item.teacher}
              </div>
            </div>
          </div>
        `;
      }

      container.innerHTML = htmlContent;

    } catch (error) {
      console.error('Ошибка в скрипте:', error);
      container.innerHTML = `<div style="color: red; text-align: center; margin-top: 20px;">Ошибка загрузки расписания (${error.message})</div>`;
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const firstBtn = document.querySelector('.day-btn');
    selectDay('Понедельник', firstBtn);
  });
</script>
