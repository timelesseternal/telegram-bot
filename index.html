<!-- Кнопки дней недели -->
<div class="days-tabs">
  <button class="day-btn active" onclick="selectDay('Понедельник', this)">ПН</button>
  <button class="day-btn" onclick="selectDay('Вторник', this)">ВТ</button>
  <button class="day-btn" onclick="selectDay('Среда', this)">СР</button>
  <button class="day-btn" onclick="selectDay('Четверг', this)">ЧТ</button>
  <button class="day-btn" onclick="selectDay('Пятница', this)">ПТ</button>
  <button class="day-btn" onclick="selectDay('Суббота', this)">СБ</button>
</div>

<div id="schedule"></div>

<script>
  async function selectDay(dayName, btn) {
    // Переключение кнопок
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

    const container = document.getElementById('schedule');
    container.innerHTML = '<div style="text-align: center; margin-top: 20px;">Загрузка расписания...</div>';

    try {
      // Чистый fetch без тяжелых заголовков
      const url = `https://nickname-crib-feel.ngrok-free.dev/api/schedule/${encodeURIComponent(dayName)}?ngrok-skip-browser-warning=69420`;
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`Ошибка сервера: ${response.status}`);
      }

      const items = await response.json();

      if (!items || items.length === 0) {
        container.innerHTML = '<div style="color: var(--hint-color); text-align: center; margin-top: 20px;">Пар нет! 🎉</div>';
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="card" style="border: 1px solid #ccc; padding: 12px; margin-bottom: 10px; border-radius: 8px;">
          <div class="time-box">
            <strong style="font-size: 1.1em;">Пара №${item.num}</strong>
          </div>
          <div class="info" style="margin-top: 6px;">
            <div class="title" style="font-weight: bold;">
              ${item.title} <span class="badge" style="background: #e0e0e0; padding: 2px 6px; border-radius: 4px; font-size: 0.8em;">Тип: ${item.type}</span>
            </div>
            <div class="meta" style="color: #666; font-size: 0.9em; margin-top: 4px;">
              🚪 ${item.room} • 👨‍🏫 ${item.teacher}
            </div>
          </div>
        </div>
      `).join('');

    } catch (error) {
      console.error('Ошибка:', error);
      container.innerHTML = '<div style="color: red; text-align: center; margin-top: 20px;">Ошибка загрузки расписания</div>';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    // Выбираем первую кнопку по умолчанию
    const firstBtn = document.querySelector('.day-btn');
    selectDay('Понедельник', firstBtn);
  });
</script>
