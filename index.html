<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Расписание</title>

  <!-- Подключение Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      background-color: var(--tg-theme-bg-color, #0f0f0f);
      color: var(--tg-theme-text-color, #ffffff);
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    /* Главный контейнер с адаптивными безопасными отступами */
    .app-wrapper {
      padding-top: calc(var(--tg-content-safe-area-inset-top, env(safe-area-inset-top, 20px)) + 16px);
      padding-bottom: calc(var(--tg-content-safe-area-inset-bottom, env(safe-area-inset-bottom, 20px)) + 16px);
      padding-left: 12px;
      padding-right: 12px;
      box-sizing: border-box;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .status-bar {
      background: var(--tg-theme-secondary-bg-color, #1c1c1e);
      color: var(--tg-theme-link-color, #64b5f6);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      width: 100%;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      border: 1px solid var(--tg-theme-secondary-bg-color, #2c2c2e);
      background: var(--tg-theme-secondary-bg-color, #1c1c1e);
      color: var(--tg-theme-text-color, #ffffff);
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      white-space: nowrap;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--tg-theme-button-color, #2563eb);
      color: var(--tg-theme-button-text-color, #ffffff);
      border-color: var(--tg-theme-button-color, #2563eb);
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }

    .day-btn {
      padding: 10px 0;
      border: 1px solid var(--tg-theme-button-color, #2563eb);
      background: transparent;
      color: var(--tg-theme-button-color, #2563eb);
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
    }

    .day-btn.active {
      background: var(--tg-theme-button-color, #2563eb);
      color: var(--tg-theme-button-text-color, #ffffff);
    }

    .card {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      background: var(--tg-theme-secondary-bg-color, #1c1c1e);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .para-num {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .time-badge {
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 600;
      color: var(--tg-theme-text-color, #ffffff);
    }

    .subject {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .meta-info {
      font-size: 0.85rem;
      opacity: 0.85;
      line-height: 1.4;
    }

    .meta-info div {
      margin-top: 4px;
    }

    .badge-type {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .type-1 { background: rgba(30, 64, 175, 0.4); color: #93c5fd; border: 1px solid #1e40af; }
    .type-2 { background: rgba(107, 33, 168, 0.4); color: #e9d5ff; border: 1px solid #6b21a8; }
    .type-0 { background: rgba(22, 101, 52, 0.4); color: #86efac; border: 1px solid #166534; }

    .empty-state {
      text-align: center;
      padding: 40px 10px;
      opacity: 0.6;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

<div class="app-wrapper">
  <div class="container">
    <div class="status-bar" id="statusBar">Загрузка...</div>

    <div class="nav-tabs">
      <button class="tab-btn active" id="tabCurrent" onclick="switchWeek('current')">Текущая</button>
      <button class="tab-btn" id="tabNext" onclick="switchWeek('next')">Следующая</button>
      <button class="tab-btn" id="tabExams" onclick="switchWeek('exams')">Экзамены</button>
    </div>

    <div class="days-grid" id="daysGrid">
      <button class="day-btn" onclick="selectDay('Понедельник', this)">ПН</button>
      <button class="day-btn" onclick="selectDay('Вторник', this)">ВТ</button>
      <button class="day-btn" onclick="selectDay('Среда', this)">СР</button>
      <button class="day-btn" onclick="selectDay('Четверг', this)">ЧТ</button>
    </div>

    <div id="scheduleContainer"></div>
  </div>
</div>

<script>
  // Инициализация Telegram Mini App
  const tg = window.Telegram ? window.Telegram.WebApp : null;

  if (tg) {
    tg.ready();
    tg.expand();

    if (tg.isExpanded) {
      document.body.classList.add('is-expanded');
    }
    
    if (tg.setHeaderColor) {
      tg.setHeaderColor('secondary_bg_color');
    }
    if (tg.setBackgroundColor) {
      tg.setBackgroundColor('bg_color');
    }

    tg.onEvent('viewportChanged', () => {
      tg.expand();
    });
  }

  // Данные расписания
  const SCHEDULE = {
    'Понедельник': [
      {'пара': '1', 'sub': 'Политология (Сем)', 'teacher': 'Толеуова М. Ө.', 'room': '1к232', 'type': 2},
      {'пара': '2', 'sub': 'Физкультура (Сем)', 'teacher': 'Окасов Е. А.', 'room': 'Спорт', 'type': 0},
      {'пара': '3', 'sub': 'Комп. графика (Лек)', 'teacher': 'Коккоз М. М.', 'room': 'Гк430', 'type': 1},
      {'пара': '3', 'sub': 'Теор. вероятностей (Лаб)', 'teacher': 'Бекмагамбетова Э. К.', 'room': '1к305', 'type': 2},
      {'пара': '4', 'sub': 'Теор. вероятностей (Лаб)', 'teacher': 'Бекмагамбетова Э. К.', 'room': '1к304', 'type': 1},
      {'пара': '4', 'sub': 'Теор. вероятностей (Лек)', 'teacher': 'Бекмагамбетова Э. К.', 'room': '1к304', 'type': 2}
    ],
    'Вторник': [
      {'пара': '1', 'sub': 'Политология (Лек)', 'teacher': 'Казбеков Н. А.', 'room': '1к209', 'type': 1},
      {'пара': '1', 'sub': 'Психология (Лек)', 'teacher': 'Курымбаева С. К.', 'room': 'Гк420', 'type': 2},
      {'пара': '2', 'sub': 'Комп. графика (Лаб)', 'teacher': 'Тапенова Г. С.', 'room': 'Гк400', 'type': 0}
    ],
    'Среда': [
      {'пара': '1', 'sub': 'ООП Python (Лек)', 'teacher': 'Аубакирова А. Е.', 'room': 'Гк434', 'type': 0},
      {'пара': '2', 'sub': 'Базы данных (Лаб)', 'teacher': 'Кәмен Е. Ғ.', 'room': 'Гк400', 'type': 1},
      {'пара': '2', 'sub': 'Базы данных (Лек)', 'teacher': 'Кәмен Е. Ғ.', 'room': 'Гк422', 'type': 2},
      {'пара': '3', 'sub': 'ООП Python (Лаб)', 'teacher': 'Аубакирова А. Е.', 'room': 'Гк422', 'type': 0}
    ],
    'Четверг': [
      {'пара': '1', 'sub': 'Физкультура (Сем)', 'teacher': 'Окасов Е. А.', 'room': 'Спорт', 'type': 0},
      {'пара': '2', 'sub': 'Базы данных (Лаб)', 'teacher': 'Кәмен Е. Ғ.', 'room': 'Гк400', 'type': 0},
      {'пара': '3', 'sub': 'ООП Python (Лаб)', 'teacher': 'Аубакирова А. Е.', 'room': 'Гк430', 'type': 2}
    ]
  };

  const EXAMS = [
    { date: '12 мая (ВТ)', time: '09:00', sub: 'Комп. графика', teacher: 'Коккоз М. М.', room: 'Главный корпус, 422б' },
    { date: '15 мая (ПТ)', time: '09:00', sub: 'Психология', teacher: 'Курымбаева С. К.', room: 'Корпус №1, 232' },
    { date: '15 мая (ПТ)', time: '09:00', sub: 'Политология', teacher: 'Казбеков Н. А.', room: 'Корпус №1, 232' },
    { date: '18 мая (ПН)', time: '09:00', sub: 'Базы данных', teacher: 'Кәмен Е. Ғ.', room: 'Главный корпус, 421' },
    { date: '21 мая (ЧТ)', time: '09:00', sub: 'Теор. вероятностей', teacher: 'Бекмагамбетова Э. К.', room: 'Корпус №1, 312' }
  ];

  function getWeekType(date = new Date()) {
    const target = new Date(date.valueOf());
    const dayNr = (date.getDay() + 6) % 7;
    target.setDate(target.getDate() - dayNr + 3);
    const firstThursday = target.valueOf();
    target.setMonth(0, 1);
    if (target.getDay() !== 4) {
      target.setMonth(0, 1 + ((4 - target.getDay() + 7) % 7));
    }
    const weekNumber = 1 + Math.round((firstThursday - target) / 604800000);
    return (weekNumber % 2 !== 0) ? 1 : 2;
  }

  function getTime(paraNum) {
    const times = {
      '1': '09:00 - 10:45',
      '2': '10:55 - 12:40',
      '3': '13:10 - 14:55',
      '4': '15:05 - 16:50',
      '5': '17:00 - 18:45'
    };
    return times[paraNum] || 'Время неизвестно';
  }

  let currentMode = 'current';

  // В JS getDay() возвращает: 0 - Воскресенье, 1 - Понедельник, 2 - Вторник, 3 - Среда, 4 - Четверг, 5 - Пятница, 6 - Суббота
  const daysMap = [
    'Понедельник', // 0 (Вс) -> Понедельник
    'Понедельник', // 1 (Пн)
    'Вторник',     // 2 (Вт)
    'Среда',       // 3 (Ср)
    'Четверг',     // 4 (Чт)
    'Понедельник', // 5 (Пт) -> Понедельник
    'Понедельник'  // 6 (Сб) -> Понедельник
  ];
  
  const todayIndex = new Date().getDay();
  let selectedDay = daysMap[todayIndex];

  function getShortDayName(fullDay) {
    const shortNames = {
      'Понедельник': 'ПН',
      'Вторник': 'ВТ',
      'Среда': 'СР',
      'Четверг': 'ЧТ'
    };
    return shortNames[fullDay] || 'ПН';
  }

  function updateStatusBar() {
    const currentWeekType = getWeekType();
    const currentWeekName = currentWeekType === 1 ? "Числитель ⚡" : "Знаменатель 🌙";
    const bar = document.getElementById('statusBar');

    if (currentMode === 'current') {
      bar.innerHTML = `Текущая неделя: <b>${currentWeekName}</b>`;
    } else if (currentMode === 'next') {
      const nextWeekName = currentWeekType === 1 ? "Знаменатель 🌙" : "Числитель ⚡";
      bar.innerHTML = `След. неделя: <b>${nextWeekName}</b>`;
    } else {
      bar.innerHTML = `📌 <b>Расписание экзаменов</b>`;
    }
  }

  function switchWeek(mode) {
    currentMode = mode;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if (mode === 'current') document.getElementById('tabCurrent').classList.add('active');
    if (mode === 'next') document.getElementById('tabNext').classList.add('active');
    if (mode === 'exams') document.getElementById('tabExams').classList.add('active');

    const daysGrid = document.getElementById('daysGrid');
    if (mode === 'exams') {
      daysGrid.style.display = 'none';
      renderExams();
    } else {
      daysGrid.style.display = 'grid';
      renderSchedule();
    }
    updateStatusBar();
  }

  function selectDay(dayName, btn) {
    selectedDay = dayName;
    
    document.querySelectorAll('.day-btn').forEach(b => {
      if (b.textContent.trim() === getShortDayName(dayName)) {
        b.classList.add('active');
      } else {
        b.classList.remove('active');
      }
    });

    renderSchedule();
  }

  function renderSchedule() {
    const container = document.getElementById('scheduleContainer');
    const currentWeekType = getWeekType();
    let targetWeek = currentMode === 'next' ? (currentWeekType === 1 ? 2 : 1) : currentWeekType;

    const dayLessons = SCHEDULE[selectedDay] || [];
    const filteredLessons = dayLessons.filter(l => l.type === 0 || l.type === targetWeek);

    if (filteredLessons.length === 0) {
      container.innerHTML = '<div class="empty-state">🎉 На этот день пар нет!</div>';
      return;
    }

    let html = '';
    filteredLessons.forEach(item => {
      let typeBadge = '';
      if (item.type === 1) typeBadge = '<span class="badge-type type-1">Числитель</span>';
      else if (item.type === 2) typeBadge = '<span class="badge-type type-2">Знаменатель</span>';
      else typeBadge = '<span class="badge-type type-0">Каждую неделю</span>';

      html += `
        <div class="card">
          <div class="card-header">
            <span class="para-num">Пара №${item.пара}</span>
            <span class="time-badge">🕐 ${getTime(item.пара)}</span>
          </div>
          <div class="subject">${item.sub}</div>
          <div class="meta-info">
            <div>👩‍🏫 ${item.teacher}</div>
            <div>🚪 Кабинет: <strong>${item.room}</strong></div>
            <div>${typeBadge}</div>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  function renderExams() {
    const container = document.getElementById('scheduleContainer');
    let html = '';
    EXAMS.forEach(exam => {
      html += `
        <div class="card" style="border-left: 4px solid var(--tg-theme-button-color, #2563eb);">
          <div class="card-header">
            <span class="para-num">📅 ${exam.date}</span>
            <span class="time-badge">🕐 ${exam.time}</span>
          </div>
          <div class="subject">💻 ${exam.sub}</div>
          <div class="meta-info">
            <div>👨‍🏫 Препод: ${exam.teacher}</div>
            <div>📍 Локация: <strong>${exam.room}</strong></div>
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  document.addEventListener('DOMContentLoaded', () => {
    updateStatusBar();

    // Автоматическая подсветка кнопки текущего дня
    const shortName = getShortDayName(selectedDay);
    document.querySelectorAll('.day-btn').forEach(btn => {
      if (btn.textContent.trim() === shortName) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    renderSchedule();
  });
</script>
</body>
</html>
