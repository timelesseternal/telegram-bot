<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Univer</title>
  <meta name="description" content="Расписание пар, экзаменов и материалов УМКД">
  <meta name="color-scheme" content="light dark">

  <meta name="theme-color" content="#FAF9F4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      /* -- paper / ink tokens -- */
      --paper: #FAF9F4;
      --paper-2: #F1EFE6;
      --ink: #16160F;
      --ink-soft: #6B6A60;
      --line: #DBD8C9;
      --overlay: rgba(22, 22, 15, 0.42);

      /* -- single functional accent -- */
      --accent: #C41E24;
      --accent-text: #FFFFFF;
      --accent-rgb: 196, 30, 36;
      --highlight-border: var(--accent);
      --highlight-bg: rgba(196, 30, 36, 0.05);
      --progress-bg: var(--line);
      --accent-tint-strong: rgba(196, 30, 36, 0.14);
      --accent-tint-soft: rgba(196, 30, 36, 0.04);

      /* -- type -- */
      --font-display: 'Manrope', -apple-system, sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    [data-theme="dark"] {
      --paper: #131310;
      --paper-2: #1D1D18;
      --ink: #F2F0E6;
      --ink-soft: #9C9A8D;
      --line: #34332B;
      --overlay: rgba(0, 0, 0, 0.6);

      --accent: #FF6A5E;
      --accent-text: #1A0906;
      --accent-rgb: 255, 106, 94;
      --highlight-border: var(--accent);
      --highlight-bg: rgba(255, 106, 94, 0.07);
      --progress-bg: var(--line);
      --accent-tint-strong: rgba(255, 106, 94, 0.18);
      --accent-tint-soft: rgba(255, 106, 94, 0.06);
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-body);
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--paper);
      color: var(--ink);
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .app-wrapper {
      padding-top: calc(env(safe-area-inset-top, 20px) + 14px);
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 20px);
      padding-left: 18px;
      padding-right: 18px;
      box-sizing: border-box;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    /* ============ MASTHEAD ============ */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--ink);
    }

    .status-info-left {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1 1 auto;
    }

    .masthead-eyebrow {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 3px;
    }

    .masthead-headline {
      display: block;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.5rem;
      line-height: 1.05;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-lesson-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--ink-soft);
      margin-top: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ink-soft);
      flex-shrink: 0;
      transition: background-color 0.2s ease;
    }
    @keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    .live-lesson-badge.pulse-live .live-dot {
      background: var(--accent);
      animation: dotPulse 1.5s ease-in-out infinite;
    }
    .live-dot.pulse-live-tag {
      background: var(--accent);
      animation: dotPulse 1.5s ease-in-out infinite;
    }

    .header-right-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
      padding-left: 10px;
    }
    .header-right-top {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
    }

    .weather-widget, .theme-btn {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--ink);
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 5px 9px;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.02em;
      transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    .weather-widget:active, .theme-btn:active { transform: scale(0.95); border-color: var(--ink); }

    .theme-btn::before { content: "🎨 цвет"; }

    .today-btn {
      display: none;
      align-items: center;
      gap: 4px;
      background: var(--accent);
      color: var(--accent-text);
      border: 1px solid var(--accent);
      border-radius: 2px;
      padding: 5px 9px;
      font-family: var(--font-mono);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.68rem;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .today-btn:active { transform: scale(0.95); opacity: 0.85; }

    /* ============ MODALS ============ */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--overlay);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: var(--paper);
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 3px;
      width: 85%;
      max-width: 320px;
      text-align: left;
      transform: translateY(6px);
      opacity: 0;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .modal-overlay.active .modal-card { transform: translateY(0); opacity: 1; }

    .modal-title {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 14px;
      color: var(--ink-soft);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .modal-select {
      width: 100%;
      padding: 10px 0;
      border: none;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 12px;
    }
    .modal-select:focus { border-bottom-color: var(--ink); }

    .city-list {
      max-height: 220px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 16px;
      border-top: 1px solid var(--line);
    }
    .city-list-item {
      padding: 10px 2px;
      font-family: var(--font-body);
      font-size: 0.88rem;
      color: var(--ink);
      cursor: pointer;
      border-bottom: 1px solid var(--line);
      transition: background-color 0.12s ease, color 0.12s ease, padding-left 0.12s ease;
    }
    .city-list-item:active { background: var(--paper-2); }
    .city-list-item.selected {
      background: var(--accent);
      color: var(--accent-text);
      padding-left: 8px;
      font-weight: 600;
    }
    .city-list-empty {
      padding: 18px 2px;
      text-align: center;
      color: var(--ink-soft);
      font-family: var(--font-mono);
      font-size: 0.78rem;
    }

    .modal-buttons { display: flex; gap: 10px; }
    .modal-btn {
      flex: 1;
      padding: 11px;
      border: 1px solid var(--ink);
      border-radius: 2px;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
      background: transparent;
      color: var(--ink);
      transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease;
    }
    .modal-btn:active { transform: scale(0.96); }
    .modal-btn.cancel { border-color: var(--line); color: var(--ink-soft); }
    .modal-btn.save { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

    /* accent picker */
    .accent-swatch-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .accent-swatch {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 10px 4px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      text-align: center;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }
    .accent-swatch:active { transform: scale(0.95); }
    .accent-swatch.selected {
      box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--ink);
    }
    .accent-swatch-check {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 3px;
      opacity: 0;
    }
    .accent-swatch.selected .accent-swatch-check { opacity: 1; }
    .accent-swatch-label { display: block; line-height: 1.2; text-transform: uppercase; letter-spacing: 0.02em; }
    .accent-swatch-hex { display: block; font-size: 0.6rem; opacity: 0.75; margin-top: 3px; }

    .accent-default-btn {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 11px;
      margin-bottom: 14px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: transparent;
      color: var(--ink);
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .accent-default-btn.selected { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .accent-default-check { opacity: 0; }
    .accent-default-btn.selected .accent-default-check { opacity: 1; }

    /* ============ TABS ============ */
    .nav-tabs {
      position: relative;
      display: flex;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--line);
    }
    .tab-indicator {
      position: absolute;
      bottom: -1px;
      left: 0;
      height: 2px;
      width: 0;
      background: var(--accent);
      transition: transform 0.25s cubic-bezier(0.4,0,0.2,1), width 0.25s cubic-bezier(0.4,0,0.2,1);
      z-index: 1;
    }
    .tab-btn {
      position: relative;
      flex: 1;
      padding: 10px 4px 12px;
      border: none;
      background: none;
      color: var(--ink-soft);
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      text-align: center;
      transition: color 0.2s ease;
    }
    .tab-btn.active { color: var(--accent); font-weight: 700; }

    /* ============ DAYS ============ */
    .days-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      margin: 14px 0 20px;
    }
    .day-indicator {
      position: absolute;
      top: 0; left: 0;
      width: 0; height: 0;
      opacity: 0;
      background: var(--accent);
      transition: transform 0.25s cubic-bezier(0.4,0,0.2,1), width 0.2s ease, height 0.2s ease, opacity 0.15s ease;
      z-index: 0;
    }
    .day-btn {
      position: relative;
      z-index: 1;
      padding: 10px 0;
      border: 1px solid var(--line);
      margin-left: -1px;
      background: transparent;
      color: var(--ink);
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.03em;
      cursor: pointer;
      text-align: center;
      transition: color 0.2s ease;
    }
    .day-btn:first-child { margin-left: 0; }
    .day-btn.active { color: var(--accent-text) !important; }

    .day-btn.is-today::after {
      content: '';
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 3px;
      background-color: var(--accent);
      border-radius: 50%;
      z-index: 2;
    }
    .day-btn.active.is-today::after { background-color: var(--accent-text); }

    .weekend-badge {
      grid-column: 1 / -1;
      text-align: left;
      padding: 10px 0 0;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 0.78rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      position: relative;
      z-index: 1;
      display: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .weekend-badge.active { opacity: 1; }
    .weekend-badge::before { content: "— "; }

    /* ============ CONTENT TRANSITION ============ */
    #scheduleContainer {
      transition: opacity 0.2s ease, transform 0.2s ease;
      opacity: 1;
      transform: translateY(0);
    }
    #scheduleContainer.content-hidden { opacity: 0; transform: translateY(6px); }

    /* ============ SCHEDULE LIST (timetable-board look) ============ */
    .list-row {
      display: flex;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
      opacity: 1;
    }
    .list-row:last-child { border-bottom: none; }

    @keyframes rowEnter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .list-row.row-enter { animation: rowEnter 0.32s cubic-bezier(0.4,0,0.2,1) both; }

    .row-index {
      flex-shrink: 0;
      min-width: 56px;
      font-family: var(--font-mono);
    }
    .row-index-main {
      display: block;
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--ink);
    }
    .row-index-sub {
      display: block;
      font-size: 0.68rem;
      color: var(--ink-soft);
      margin-top: 3px;
    }
    .row-index.is-numeral .row-index-main {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
    }

    .list-row.is-live .row-index.is-numeral .row-index-main { color: var(--accent); }

    .row-body { flex: 1; min-width: 0; }
    .row-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .row-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.3;
      color: var(--ink);
    }
    .live-tag {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 600;
    }
    .row-meta {
      font-size: 0.83rem;
      color: var(--ink-soft);
      margin-top: 6px;
    }
    .meta-sep { margin: 0 7px; color: var(--line); }

    .row-tags { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.64rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 7px;
      border-radius: 2px;
      font-weight: 500;
    }
    .tag-outline { border: 1px solid var(--line); color: var(--ink-soft); }
    .tag-outline.tag-muted { opacity: 0.75; }
    .tag-fill { background: var(--ink); color: var(--paper); border: 1px solid var(--ink); }

    .lesson-progress-container {
      margin-top: 10px;
      background: var(--progress-bg);
      height: 2px;
      width: 100%;
      overflow: hidden;
    }
    .lesson-progress-bar {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.5s linear;
    }

    /* ============ NOTICE PANEL (day off / finished / empty) ============ */
    .notice-panel {
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 24px 20px;
    }
    .notice-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
      display: block;
    }
    .notice-eyebrow::before { content: "— "; }
    .notice-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--ink);
      margin-bottom: 18px;
    }
    .notice-divider { height: 1px; background: var(--line); margin: 18px 0; }
    .notice-hint {
      font-family: var(--font-body);
      font-size: 0.88rem;
      color: var(--ink);
      line-height: 1.5;
    }
    .notice-hint-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 6px;
    }
    .empty-state.compact {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--ink-soft);
      padding: 10px 0;
    }

    /* weather block inside notice panel */
    .weather-skeleton { display: flex; flex-direction: column; gap: 8px; }
    .weather-skeleton-row { display: flex; align-items: center; gap: 8px; }
    .weather-skeleton-block {
      border-radius: 2px;
      background: linear-gradient(90deg, var(--paper-2) 25%, var(--line) 50%, var(--paper-2) 75%);
      background-size: 200% 100%;
      animation: skeletonShimmer 1.4s ease-in-out infinite;
    }
    @keyframes skeletonShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .day-off-weather-main {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
    }
    .day-off-weather-emoji { font-size: 1.1rem; }
    .day-off-weather-temp { font-size: 1.4rem; font-weight: 700; color: var(--ink); font-family: var(--font-display); }
    .day-off-weather-desc { font-size: 0.85rem; color: var(--ink-soft); font-family: var(--font-body); }
    .day-off-weather-details {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      font-size: 0.76rem;
      color: var(--ink-soft);
      font-family: var(--font-mono);
    }

    /* ============ UMKD LISTS ============ */
    .umkd-subject-row, .umkd-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.94rem;
      color: var(--ink);
    }
    .umkd-item { font-family: var(--font-body); font-weight: 500; font-size: 0.88rem; }
    .umkd-subject-row:last-child, .umkd-item:last-child { border-bottom: none; }
    .umkd-arrow {
      font-family: var(--font-mono);
      color: var(--ink-soft);
      font-size: 0.78rem;
      flex-shrink: 0;
      padding-left: 10px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--paper-2);
      border: 1px solid var(--ink);
      padding: 8px 12px;
      margin-bottom: 16px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink);
      cursor: pointer;
      border-radius: 2px;
      transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease;
    }
    .back-link:active { transform: scale(0.96); background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>

<div class="modal-overlay" id="cityModal">
  <div class="modal-card">
    <div class="modal-title">Выбор города</div>
    <input
      type="text"
      id="citySearchInput"
      class="modal-select"
      placeholder="Введите или выберите город…"
      autocomplete="off"
      oninput="filterCityList(this.value)"
    >
    <div class="city-list" id="cityList"></div>
    <div class="modal-buttons">

  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE_NAME = 'univer-pwa-v1';
      self.addEventListener('install', (e) => { self.skipWaiting(); });
      self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
      self.addEventListener('fetch', (e) => {
        e.respondWith(
          caches.match(e.request).then((cachedResponse) => {
            if (cachedResponse) {
              fetch(e.request).then((networkResponse) => {
                if (networkResponse && networkResponse.status === 200) {
                  caches.open(CACHE_NAME).then((cache) => cache.put(e.request, networkResponse));
                }
              }).catch(() => {});
              return cachedResponse;
            }
            return fetch(e.request).then((networkResponse) => {
              return caches.open(CACHE_NAME).then((cache) => {
                cache.put(e.request, networkResponse.clone());
                return networkResponse;
              });
            }).catch(() => caches.match('./'));
          })
        );
      });
    `;
    const swBlob = new Blob([swCode], { type: 'text/javascript' });
    const swUrl = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl).catch(err => console.log('SW error', err));
  }

    tg.onEvent('viewportChanged', () => tg.expand());
  }

    if (tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred) {
      try { tg.HapticFeedback.impactOccurred(style || 'light'); } catch (e) { /* ignore */ }
    }
  }

  async function fetchWeather(location, timeoutMs = 8000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const response = await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${location.lat}&longitude=${location.lon}&current=temperature_2m,weather_code`,
        { signal: controller.signal }
      );
      if (!response.ok) throw new Error('bad status ' + response.status);
      return await response.json();
    } finally {
      clearTimeout(timer);
    }
  }

  function weatherEmoji(code) {
    if (code === 0) return '☀';
    if (code >= 1 && code <= 3) return '⛅';
    if (code >= 45 && code <= 48) return '≈';
    if (code >= 51 && code <= 67) return '☂';
    if (code >= 71 && code <= 77) return '❄';
    if (code >= 80 && code <= 82) return '☔';
    if (code >= 95) return '⚡';
    return '—';
  }

  function weatherDescription(code) {
    const map = {
      0: 'Ясно', 1: 'Малооблачно', 2: 'Облачно с прояснениями', 3: 'Пасмурно',
      45: 'Туман', 48: 'Изморозь',
      51: 'Морось', 53: 'Морось', 55: 'Морось',
      61: 'Дождь', 63: 'Дождь', 65: 'Сильный дождь',
      71: 'Снег', 73: 'Снег', 75: 'Сильный снегопад',
      80: 'Ливень', 81: 'Ливень', 82: 'Сильный ливень',
      95: 'Гроза'
    };
    return map[code] || 'Погода';
  }

  async function fetchDayWeatherDetails(location, timeoutMs = 8000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${location.lat}&longitude=${location.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
      const response = await fetch(url, { signal: controller.signal });
      if (!response.ok) throw new Error('bad status ' + response.status);
      return await response.json();
    } finally {
      clearTimeout(timer);
    }
  }

  let dayOffWeatherCache = { city: null, data: null, timestamp: 0 };

  function renderDayOffWeatherHtml(data) {
    const target = document.getElementById('dayOffWeatherDetail');
    if (!target) return;
    const cur = data.current;
    const emoji = weatherEmoji(cur.weather_code);
    const desc = weatherDescription(cur.weather_code);
    const temp = Math.round(cur.temperature_2m);
    const feels = Math.round(cur.apparent_temperature);
    const humidity = Math.round(cur.relative_humidity_2m);
    const wind = Math.round(cur.wind_speed_10m);
    const hasDaily = data.daily && data.daily.temperature_2m_max && data.daily.temperature_2m_min;
    const tMax = hasDaily ? Math.round(data.daily.temperature_2m_max[0]) : null;
    const tMin = hasDaily ? Math.round(data.daily.temperature_2m_min[0]) : null;
    const rangeHtml = (tMax !== null && tMin !== null)
      ? `<span>${tMin > 0 ? '+' + tMin : tMin}° / ${tMax > 0 ? '+' + tMax : tMax}°</span>`
      : '';
    target.innerHTML = `
      <div class="day-off-weather-main">
        <span class="day-off-weather-emoji">${emoji}</span>
        <span class="day-off-weather-temp">${temp > 0 ? '+' + temp : temp}°C</span>
        <span class="day-off-weather-desc">${desc}</span>
      </div>
      <div class="day-off-weather-details">
        <span>ощущается как ${feels > 0 ? '+' + feels : feels}°</span>
        ${rangeHtml}
        <span>влажность ${humidity}%</span>
        <span>ветер ${wind} км/ч</span>
      </div>
    `;
  }

  async function fillDayOffWeather() {
    const el = document.getElementById('dayOffWeatherDetail');
    if (!el) return;
    let savedCity = localStorage.getItem('user_city');
    if (!savedCity || !CITY_COORDS[savedCity]) savedCity = 'Павлодар';

    const cacheFresh = dayOffWeatherCache.city === savedCity
      && (Date.now() - dayOffWeatherCache.timestamp) < 5 * 60 * 1000;
    if (cacheFresh) {
      renderDayOffWeatherHtml(dayOffWeatherCache.data);
      return;
    }

    try {
      const data = await fetchDayWeatherDetails(CITY_COORDS[savedCity]);
      dayOffWeatherCache = { city: savedCity, data, timestamp: Date.now() };
      renderDayOffWeatherHtml(data);
    } catch (e) {
      const stillThere = document.getElementById('dayOffWeatherDetail');
      if (stillThere) stillThere.innerHTML = 'не удалось загрузить погоду';
    }
  }

  async function loadWeather(isRetry) {
    const weatherEl = document.getElementById('weatherWidget');
    let savedCity = localStorage.getItem('user_city');
    if (!savedCity || !CITY_COORDS[savedCity]) {
      savedCity = 'Павлодар';
      localStorage.setItem('user_city', savedCity);
    }

    if (!isRetry) weatherEl.innerHTML = savedCity + ' · …';
    const location = CITY_COORDS[savedCity];

    try {
      const data = await fetchWeather(location);
      const temp = Math.round(data.current.temperature_2m);
      weatherEl.innerHTML = `${savedCity} · ${temp > 0 ? '+' + temp : temp}°`;
    } catch (e) {
      if (!isRetry) {
        setTimeout(() => loadWeather(true), 4000);
        weatherEl.innerHTML = savedCity + ' · …';
      } else {
        weatherEl.innerHTML = savedCity + ' · —°';
      }
    }
  }

    const query = filterText.trim().toLowerCase();

    if (names.length === 0) {

    list.innerHTML = names.map(name => `

  const ACCENT_CSS_PROPS = ['--accent', '--accent-text', '--accent-rgb', '--highlight-border', '--highlight-bg', '--progress-bg', '--accent-tint-strong', '--accent-tint-soft'];
  let currentAccentId = 'default';
  let pendingAccentId = 'default';

  function hexToRgbTriple(hex) {
    const clean = hex.replace('#', '');
    const bigint = parseInt(clean, 16);
    return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
  }

  function applyAccentTheme(id, persist = true) {
    const root = document.documentElement.style;
    if (id === 'default') {
      ACCENT_CSS_PROPS.forEach(prop => root.removeProperty(prop));
    } else {
      const theme = ACCENT_THEMES.find(t => t.id === id);
      if (!theme) return;
      const { r, g, b } = hexToRgbTriple(theme.hex);
      const rgbStr = `${r}, ${g}, ${b}`;
      root.setProperty('--accent', theme.hex);
      root.setProperty('--accent-text', theme.text);
      root.setProperty('--accent-rgb', rgbStr);
      root.setProperty('--highlight-border', theme.hex);
      root.setProperty('--highlight-bg', `rgba(${rgbStr}, 0.06)`);
      root.setProperty('--progress-bg', `var(--line)`);
      root.setProperty('--accent-tint-strong', `rgba(${rgbStr}, 0.18)`);
      root.setProperty('--accent-tint-soft', `rgba(${rgbStr}, 0.05)`);
    }
    currentAccentId = id;
    if (persist) localStorage.setItem('user_accent', id);
  }

  function renderAccentSwatches() {
    const grid = document.getElementById('accentSwatchGrid');
    if (!grid) return;
    const colorThemes = ACCENT_THEMES.filter(t => t.id !== 'default');

        <span class="accent-swatch-label">${t.name}</span>
        <span class="accent-swatch-hex">${t.hex}</span>
      </button>
    `).join('');

    const defaultBtn = document.getElementById('accentDefaultBtn');
    if (defaultBtn) defaultBtn.classList.toggle('selected', pendingAccentId === 'default');
  }

    haptic('light');
    pendingAccentId = id;
    renderAccentSwatches();

  };

  function getWeekType(date = new Date()) {
    const target = new Date(date.valueOf());
    const dayNr = (date.getDay() + 6) % 7;
    target.setDate(target.getDate() - dayNr + 3);
    const firstThursday = target.valueOf();
    target.setMonth(0, 1);
    if (target.getDay() !== 4) {
      target.setMonth(0, 1 + ((4 - target.getDay() + 7) % 7));
    }
    const weekNumber = 1 + Math.round((firstThursday - target) / 604800000);
    return (weekNumber % 2 !== 0) ? 1 : 2;
  }

  const LESSON_TIMES = {
    '1': { start: '09:00', end: '10:45' },
    '2': { start: '10:55', end: '12:40' },
    '3': { start: '13:10', end: '14:55' },
    '4': { start: '15:05', end: '16:50' },
    '5': { start: '17:00', end: '18:45' }
  };

  function getTime(paraNum) {
    const t = LESSON_TIMES[paraNum];
    return t ? `${t.start}–${t.end}` : 'время неизвестно';
  }

  function timeToMins(timeStr) {
    const [h, m] = timeStr.split(':').map(Number);
    return h * 60 + m;
  }

  function dayHasClasses(dayName) {
    return Array.isArray(SCHEDULE[dayName]) && SCHEDULE[dayName].length > 0;
  }

  function getTomorrowDate() {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    return d;
  }

  function getUpcomingHintFromDate(baseDate) {
    for (let offset = 0; offset <= 8; offset++) {
      const d = new Date(baseDate);
      d.setDate(d.getDate() + offset);
      const dayName = DAY_NAMES_BY_INDEX[d.getDay()];
      const weekType = getWeekType(d);
      const lessons = (SCHEDULE[dayName] || [])
        .filter(l => l.type === 0 || l.type === weekType)
        .slice()
        .sort((a, b) => parseInt(a.пара, 10) - parseInt(b.пара, 10));

      if (lessons.length > 0) {
        const first = lessons[0];
        const t = LESSON_TIMES[first.пара];
        const timeStr = t ? t.start : '?';
        const shortDay = getShortDayName(dayName) || dayName;
        return `<strong>${first.sub}</strong> — ${shortDay}, ${timeStr}, ауд. ${first.room}`;
      }
    }
    return 'ближайших пар пока не видно';
  }

  function weatherSkeletonHtml() {
    return `
      <div class="weather-skeleton">
        <div class="weather-skeleton-row">
          <div class="weather-skeleton-block" style="width:60px; height:24px;"></div>
          <div class="weather-skeleton-block" style="width:90px; height:18px;"></div>
        </div>
        <div class="weather-skeleton-row">
          <div class="weather-skeleton-block" style="width:100px; height:12px;"></div>
          <div class="weather-skeleton-block" style="width:60px; height:12px;"></div>
        </div>
      </div>
    `;
  }

  function buildDayOffScreen(dayName, animateEntrance = true) {
    const hint = getUpcomingHintFromDate(getTomorrowDate());
    const isActuallyToday = dayName === realTodayName && currentMode === 'current';
    const title = isActuallyToday ? 'Сегодня без пар' : `${dayName}: пар нет`;
    return `
      <div class="notice-panel">
        <span class="notice-eyebrow">выходной</span>
        <div class="notice-title">${title}</div>
        <div class="day-off-weather" id="dayOffWeatherDetail">${weatherSkeletonHtml()}</div>
        <div class="notice-divider"></div>
        <div class="notice-hint">
          <span class="notice-hint-label">ближайшая пара</span>
          ${hint}
        </div>
      </div>
    `;
  }

  function buildDayFinishedScreen(dayName, animateEntrance = true) {
    const hint = getUpcomingHintFromDate(getTomorrowDate());
    return `
      <div class="notice-panel">
        <span class="notice-eyebrow">на сегодня всё</span>
        <div class="notice-title">${dayName}: пары закончились</div>
        <div class="day-off-weather" id="dayOffWeatherDetail">${weatherSkeletonHtml()}</div>
        <div class="notice-divider"></div>
        <div class="notice-hint">
          <span class="notice-hint-label">ближайшая пара</span>
          ${hint}
        </div>
      </div>
    `;
  }

  function getDayLastLessonEndMins(dayName, weekType) {
    const lessons = (SCHEDULE[dayName] || []).filter(l => l.type === 0 || l.type === weekType);
    let maxEnd = null;
    lessons.forEach(l => {
      const t = LESSON_TIMES[l.пара];
      if (t) {
        const endMins = timeToMins(t.end);
        if (maxEnd === null || endMins > maxEnd) maxEnd = endMins;
      }
    });
    return maxEnd;
  }

  let currentMode = 'current';
  let selectedDay = 'Понедельник';
  let selectedUmkdSubject = null;
  let realTodayName = 'Понедельник';

  const DAY_NAMES_BY_INDEX = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];

  function detectToday() {
    realTodayName = DAY_NAMES_BY_INDEX[new Date().getDay()];
    selectedDay = realTodayName;

    const shortName = getShortDayName(realTodayName);
    if (shortName) {
      const todayBtnEl = document.getElementById(`btn-${shortName}`);
      if (todayBtnEl) todayBtnEl.classList.add('is-today');
    }
    updateWeekendBadge();
  }

  let weekendBadgeHideTimer = null;

  function updateWeekendBadge() {
    const badge = document.getElementById('weekendBadge');
    if (!badge) return;
    const hasOwnButton = ['Понедельник', 'Вторник', 'Среда', 'Четверг'].includes(realTodayName);
    const shouldShow = !hasOwnButton;

    if (weekendBadgeHideTimer) {
      clearTimeout(weekendBadgeHideTimer);
      weekendBadgeHideTimer = null;
    }

    if (shouldShow) {
      if (badge.style.display !== 'block') {
        badge.style.display = 'block';
        void badge.offsetWidth;
      }
      badge.classList.add('active');
    } else {
      badge.classList.remove('active');
      weekendBadgeHideTimer = setTimeout(() => {
        badge.style.display = 'none';
        weekendBadgeHideTimer = null;
      }, 220);
    }
  }

  function getShortDayName(fullDay) {
    const shortNames = {
      'Понедельник': 'ПН', 'Вторник': 'ВТ', 'Среда': 'СР', 'Четверг': 'ЧТ',
      'Пятница': 'ПТ', 'Суббота': 'СБ', 'Воскресенье': 'ВС'
    };
    return shortNames[fullDay] || null;
  }

  function updateStatusBarAndLive() {
    const currentWeekType = getWeekType();
    const currentWeekName = currentWeekType === 1 ? "Числитель" : "Знаменатель";
    const currentWeekRoman = currentWeekType === 1 ? "I" : "II";
    const statusText = document.getElementById('weekStatusText');
    const badgeEl = document.getElementById('liveLessonBadge');
    const todayBtn = document.getElementById('todayBtn');

    todayBtn.style.display = (selectedDay !== realTodayName || currentMode !== 'current') ? 'flex' : 'none';

    if (currentMode === 'current') {
      statusText.innerHTML = `<span class="masthead-eyebrow">Неделя ${currentWeekRoman}</span><span class="masthead-headline">${currentWeekName}</span>`;
    } else if (currentMode === 'next') {
      const nextWeekName = currentWeekType === 1 ? "Знаменатель" : "Числитель";
      const nextRoman = currentWeekType === 1 ? "II" : "I";
      statusText.innerHTML = `<span class="masthead-eyebrow">Неделя ${nextRoman} · далее</span><span class="masthead-headline">${nextWeekName}</span>`;
    } else if (currentMode === 'exams') {
      statusText.innerHTML = `<span class="masthead-eyebrow">Раздел</span><span class="masthead-headline">Экзамены</span>`;
    } else {
      statusText.innerHTML = `<span class="masthead-eyebrow">Раздел</span><span class="masthead-headline">УМКД</span>`;
    }

    if (!dayHasClasses(realTodayName)) {
      badgeEl.innerHTML = `<span class="live-dot"></span><span>сегодня без пар</span>`;
      badgeEl.classList.remove('pulse-live');
      return;
    }

    const now = new Date();
    const currentMins = now.getHours() * 60 + now.getMinutes();
    const currentWeekTypeForToday = getWeekType();

    const dayLessons = SCHEDULE[realTodayName] || [];
    const activeLessons = dayLessons.filter(l => l.type === 0 || l.type === currentWeekTypeForToday);

    let currentParaNum = null;
    let nextParaInfo = null;

    for (const item of activeLessons) {
      const t = LESSON_TIMES[item.пара];
      if (!t) continue;
      const startMins = timeToMins(t.start);
      const endMins = timeToMins(t.end);

      if (currentMins >= startMins && currentMins <= endMins) {
        currentParaNum = item.пара;
        break;
      } else if (currentMins < startMins) {
        if (!nextParaInfo) nextParaInfo = { num: item.пара, start: t.start };
      }
    }

    if (currentParaNum) {
      const t = LESSON_TIMES[currentParaNum];
      const endMins = timeToMins(t.end);
      const leftMins = endMins - currentMins;
      badgeEl.innerHTML = `<span class="live-dot"></span><span>идёт пара №${currentParaNum} — ещё ${leftMins} мин</span>`;
    } else if (nextParaInfo) {
      badgeEl.innerHTML = `<span class="live-dot"></span><span>далее — пара №${nextParaInfo.num} в ${nextParaInfo.start}</span>`;
    } else if (activeLessons.length === 0) {
      badgeEl.innerHTML = `<span class="live-dot"></span><span>сегодня без пар</span>`;
    } else {
      badgeEl.innerHTML = `<span class="live-dot"></span><span>пары на сегодня закончены</span>`;
    }
    badgeEl.classList.toggle('pulse-live', !!currentParaNum);
  }

  function jumpToToday() {
    haptic('light');
    switchWeek('current');
    selectDay(realTodayName, null);
  }

  function switchWeek(mode) {
    if (mode === currentMode) return;
    haptic('light');
    currentMode = mode;
    selectedUmkdSubject = null;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if (mode === 'current') document.getElementById('tabCurrent').classList.add('active');
    if (mode === 'next') document.getElementById('tabNext').classList.add('active');
    if (mode === 'exams') document.getElementById('tabExams').classList.add('active');
    if (mode === 'umkd') document.getElementById('tabUmkd').classList.add('active');
    updateTabIndicator();

    document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
    const shortName = getShortDayName(selectedDay);
    const dayBtn = shortName ? document.getElementById(`btn-${shortName}`) : null;
    if (dayBtn) dayBtn.classList.add('active');

    const daysGrid = document.getElementById('daysGrid');
    if (mode === 'exams' || mode === 'umkd') {
      daysGrid.style.display = 'none';
      if (mode === 'exams') renderExams();
      if (mode === 'umkd') renderUmkdSubjects();
    } else {
      daysGrid.style.display = 'grid';
      updateWeekendBadge();
      renderSchedule();
    }
    updateDayIndicator();
    updateStatusBarAndLive();
  }

  function selectDay(dayName, btnElement, force = false) {
    if (!force && dayName === selectedDay) return;
    if (!force) haptic('light');
    selectedDay = dayName;
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    if (btnElement) {
      btnElement.classList.add('active');
    } else {
      const shortName = getShortDayName(dayName);
      const targetBtn = shortName ? document.getElementById(`btn-${shortName}`) : null;
      if (targetBtn) targetBtn.classList.add('active');
    }
    updateDayIndicator();
    renderSchedule();
    updateStatusBarAndLive();
  }

  let lastRenderedScreenKey = '';

  function renderSchedule(animate = true) {
    const container = document.getElementById('scheduleContainer');
    const currentWeekType = getWeekType();
    let targetWeek = currentMode === 'next' ? (currentWeekType === 1 ? 2 : 1) : currentWeekType;

    const dayLessons = SCHEDULE[selectedDay] || [];
    const filteredLessons = dayLessons.filter(l => l.type === 0 || l.type === targetWeek);

    const isViewingLiveToday = currentMode === 'current' && selectedDay === realTodayName;
    if (isViewingLiveToday && filteredLessons.length > 0) {
      const lastEndMins = getDayLastLessonEndMins(selectedDay, targetWeek);
      const now = new Date();
      const nowMins = now.getHours() * 60 + now.getMinutes();
      if (lastEndMins !== null && nowMins > lastEndMins + 30) {
        const screenKey = `${selectedDay}|${currentMode}|finished`;
        const animateEntrance = screenKey !== lastRenderedScreenKey;
        lastRenderedScreenKey = screenKey;
        const html = buildDayFinishedScreen(selectedDay, animateEntrance);
        swapContent(container, html, animate, fillDayOffWeather);
        return;
      }
    }

    if (filteredLessons.length === 0) {
      const screenKey = `${selectedDay}|${currentMode}|off`;
      const animateEntrance = screenKey !== lastRenderedScreenKey;
      lastRenderedScreenKey = screenKey;
      const html = buildDayOffScreen(selectedDay, animateEntrance);
      swapContent(container, html, animate, fillDayOffWeather);
      return;
    }

    const screenKey = `${selectedDay}|${currentMode}|schedule`;
    const animateCardsEntrance = screenKey !== lastRenderedScreenKey;
    lastRenderedScreenKey = screenKey;

    const now = new Date();
    const currentMins = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    let activeParaNow = null;
    let progressPercent = 0;

    const showLiveProgress = currentMode === 'current' && selectedDay === realTodayName && dayHasClasses(realTodayName);
    if (showLiveProgress) {
      for (const item of filteredLessons) {
        const t = LESSON_TIMES[item.пара];
        if (t) {
          const startMins = timeToMins(t.start);
          const endMins = timeToMins(t.end);
          if (currentMins >= startMins && currentMins <= endMins) {
            activeParaNow = item.пара;
            const totalDuration = endMins - startMins;
            const elapsed = currentMins - startMins;
            progressPercent = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));
            break;
          }
        }
      }
    }

    let html = '';
    filteredLessons.forEach((item, index) => {
      let typeTagHtml = '';
      if (item.type === 1) typeTagHtml = '<span class="tag tag-outline">числитель</span>';
      else if (item.type === 2) typeTagHtml = '<span class="tag tag-outline tag-muted">знаменатель</span>';
      else typeTagHtml = '<span class="tag tag-fill">каждую неделю</span>';

      const isActive = (item.пара === activeParaNow);
      let rowClass = isActive ? 'list-row is-live' : 'list-row';
      let rowStyle = '';
      if (animateCardsEntrance) {
        rowClass += ' row-enter';
        rowStyle = ` style="animation-delay: ${Math.min(index, 6) * 0.05}s;"`;
      }

      let progressBarHtml = '';
      if (isActive) {
        progressBarHtml = `
          <div class="lesson-progress-container">
            <div class="lesson-progress-bar" style="width: ${progressPercent}%"></div>
          </div>
        `;
      }

      html += `
        <div class="${rowClass}"${rowStyle}>
          <div class="row-index is-numeral">
            <span class="row-index-main">${item.пара}</span>
            <span class="row-index-sub">${getTime(item.пара)}</span>
          </div>
          <div class="row-body">
            <div class="row-top">
              <span class="row-title">${item.sub}</span>
              ${isActive ? '<span class="live-tag"><span class="live-dot pulse-live-tag"></span>сейчас</span>' : ''}
            </div>
            <div class="row-meta">${item.teacher}<span class="meta-sep">·</span>ауд. ${item.room}</div>
            <div class="row-tags">${typeTagHtml}</div>
            ${progressBarHtml}
          </div>
        </div>
      `;
    });
    swapContent(container, html, animate);
  }

  function renderExams() {
    const container = document.getElementById('scheduleContainer');
    let html = '';
    EXAMS.forEach(exam => {
      html += `
        <div class="list-row">
          <div class="row-index">
            <span class="row-index-main">${exam.date}</span>
            <span class="row-index-sub">${exam.time}</span>
          </div>
          <div class="row-body">
            <div class="row-top"><span class="row-title">${exam.sub}</span></div>
            <div class="row-meta">${exam.teacher}<span class="meta-sep">·</span>${exam.room}</div>
          </div>
        </div>
      `;
    });
    swapContent(container, html);
  }

  function renderUmkdSubjects() {
    const container = document.getElementById('scheduleContainer');
    let html = '<button class="back-link" onclick="switchWeek(\'current\')">← назад к расписанию</button>';

    for (const subject of Object.keys(UMKD_FILES)) {
      html += `
        <div class="umkd-subject-row" onclick="selectUmkdSubject('${subject.replace(/'/g, "\\'")}')">
          <span>${subject}</span>
          <span class="umkd-arrow">открыть →</span>
        </div>
      `;
    }
    swapContent(container, html);
  }

  function selectUmkdSubject(subjectName) {
    haptic('light');
    selectedUmkdSubject = subjectName;
    const container = document.getElementById('scheduleContainer');
    const files = UMKD_FILES[subjectName] || [];

    let filesHtml = '';
    if (files.length === 0) {
      filesHtml = '<div class="empty-state compact">файлы пока не загружены</div>';
    } else {
      files.forEach(file => {
        filesHtml += `
          <div class="umkd-item" onclick="openPdf('${file.name}', '${file.url}')">
            <span>${file.name}</span>
            <span class="umkd-arrow">PDF →</span>
          </div>
        `;
      });
    }

    const html = `
      <button class="back-link" onclick="renderUmkdSubjects()">← назад к списку дисциплин</button>
      <span class="masthead-eyebrow" style="margin-bottom:10px; display:block;">УМКД</span>
      <div class="notice-title" style="margin-bottom:6px;">${subjectName}</div>
      <div>${filesHtml}</div>
    `;
    swapContent(container, html);
  }

  document.addEventListener('DOMContentLoaded', () => {
    const savedAccent = localStorage.getItem('user_accent') || 'default';
    applyAccentTheme(savedAccent, false);
    detectToday();
    updateStatusBarAndLive();
    selectDay(selectedDay, null, true);
    loadWeather();
    initIndicatorsNoAnim();

    setInterval(() => {
      updateStatusBarAndLive();
      if (currentMode === 'current' && selectedDay === realTodayName && dayHasClasses(realTodayName)) {
        renderSchedule(false);
      }
    }, 1000);
  });
</script>
</body>
</html>
