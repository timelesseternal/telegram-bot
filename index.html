<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Univer</title>

  <!-- PWA настройки и иконки -->
  <meta name="theme-color" content="#0066cc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" sizes="512x512" href="https://i.ibb.co.com/0j3xZk7/univer-icon.png">
  <link rel="apple-touch-icon" href="https://i.ibb.co.com/0j3xZk7/univer-icon.png">
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Univer%22%2C%22short_name%22%3A%22Univer%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f8f9fa%22%2C%22theme_color%22%3A%22%230066cc%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fi.ibb.co.com%2F0j3xZk7%2Funiver-icon.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg-color: #f2f4f7;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #555555;
      --accent: #0066cc;
      --accent-text: #ffffff;
      --border-color: rgba(0, 0, 0, 0.08);
      --badge-bg: #f1f3f5;
      --overlay-bg: rgba(0, 0, 0, 0.35);
      --highlight-border: #0066cc;
      --highlight-bg: rgba(0, 102, 204, 0.05);
      --progress-bg: rgba(0, 102, 204, 0.12);

      /* Liquid-glass tokens */
      --glass-bg: rgba(255, 255, 255, 0.5);
      --glass-bg-strong: rgba(255, 255, 255, 0.68);
      --glass-border: rgba(255, 255, 255, 0.65);
      --glass-highlight: rgba(255, 255, 255, 0.85);
      --glass-shadow: rgba(31, 41, 55, 0.10);
      --glass-blur: 22px;
      --ambient-opacity: 0.55;

      /* Time-of-day ambient palette (updated by JS) */
      --amb-1: rgba(0, 102, 204, 0.45);
      --amb-2: rgba(147, 51, 234, 0.32);
      --amb-3: rgba(22, 163, 74, 0.28);
      --amb-4: rgba(255, 153, 51, 0.22);
    }

    [data-theme="dark"] {
      --bg-color: #0b0c0e;
      --card-bg: #18191c;
      --text-main: #f1f3f5;
      --text-muted: #9ba1a6;
      --accent: #3388ff;
      --accent-text: #ffffff;
      --border-color: rgba(255, 255, 255, 0.08);
      --badge-bg: #222428;
      --overlay-bg: rgba(0, 0, 0, 0.55);
      --highlight-border: #3388ff;
      --highlight-bg: rgba(51, 136, 255, 0.08);
      --progress-bg: rgba(51, 136, 255, 0.18);

      --glass-bg: rgba(30, 32, 36, 0.55);
      --glass-bg-strong: rgba(30, 32, 36, 0.72);
      --glass-border: rgba(255, 255, 255, 0.10);
      --glass-highlight: rgba(255, 255, 255, 0.08);
      --glass-shadow: rgba(0, 0, 0, 0.45);
      --ambient-opacity: 0.35;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
      position: relative;
    }

    /* Ambient backdrop so the glass surfaces have something to refract.
       Colors shift with the time of day (morning / day / evening / night). */
    body::before {
      content: '';
      position: fixed;
      inset: -10%;
      z-index: -1;
      opacity: var(--ambient-opacity);
      background:
        radial-gradient(circle at 18% 15%, var(--amb-1), transparent 42%),
        radial-gradient(circle at 82% 12%, var(--amb-2), transparent 46%),
        radial-gradient(circle at 25% 85%, var(--amb-3), transparent 42%),
        radial-gradient(circle at 85% 80%, var(--amb-4), transparent 45%);
      filter: blur(70px);
      animation: ambientDrift 26s ease-in-out infinite alternate;
      pointer-events: none;
      transition: opacity 0.4s ease, background 1.2s ease;
    }

    @keyframes ambientDrift {
      0%   { transform: scale(1) translate(0, 0) rotate(0deg); }
      50%  { transform: scale(1.12) translate(-2%, 3%) rotate(4deg); }
      100% { transform: scale(1.2) translate(3%, -2%) rotate(-3deg); }
    }

    .app-wrapper {
      padding-top: calc(env(safe-area-inset-top, 20px) + 12px);
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 16px);
      padding-left: 12px;
      padding-right: 12px;
      box-sizing: border-box;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .status-bar {
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 18px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 28px var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
      border: 1px solid var(--glass-border);
      transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .status-info-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
    }

    #weekStatusText {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-lesson-badge {
      display: block;
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity 0.25s ease;
    }

    .header-right-block {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .weather-widget {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid var(--glass-border);
      padding: 5px 10px;
      border-radius: 12px;
      white-space: nowrap;
      transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), background-color 0.3s ease;
    }
    .weather-widget:active { transform: scale(0.94); }

    .today-btn {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent-text);
      background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0)), var(--accent);
      padding: 6px 9px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 2px;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(0,102,204,0.35), inset 0 1px 0 rgba(255,255,255,0.35);
      transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), opacity 0.25s ease;
    }
    .today-btn:active { transform: scale(0.92); }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--overlay-bg);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--glass-bg-strong);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      backdrop-filter: blur(30px) saturate(180%);
      padding: 20px;
      border-radius: 20px;
      width: 85%;
      max-width: 320px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.18), inset 0 1px 0 var(--glass-highlight);
      border: 1px solid var(--glass-border);
      text-align: center;
      transform: scale(0.94) translateY(6px);
      transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    .modal-overlay.active .modal-card {
      transform: scale(1) translateY(0);
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .modal-select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-main);
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 14px;
      cursor: pointer;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.4,0,0.2,1);
    }
    .modal-btn:active { transform: scale(0.94); }

    .modal-btn.cancel {
      background: var(--badge-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .modal-btn.save {
      background: var(--accent);
      color: var(--accent-text);
    }

    .nav-tabs {
      position: relative;
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      width: 100%;
    }

    .tab-indicator {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0)), var(--accent);
      box-shadow: 0 4px 16px rgba(0,102,204,0.35), inset 0 1px 0 rgba(255,255,255,0.35);
      transition: transform 0.28s cubic-bezier(0.4,0,0.2,1), width 0.28s cubic-bezier(0.4,0,0.2,1);
      z-index: 0;
      pointer-events: none;
    }

    .tab-btn {
      position: relative;
      z-index: 1;
      flex: 1;
      padding: 10px 4px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      color: var(--text-muted);
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      white-space: nowrap;
      text-align: center;
      box-shadow: inset 0 1px 0 var(--glass-highlight);
      transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), color 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
    }
    .tab-btn:active { transform: scale(0.95); }

    .tab-btn.active {
      background: transparent !important;
      color: var(--accent-text) !important;
      border-color: transparent !important;
    }

    .days-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 14px;
    }

    .day-indicator {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      opacity: 0;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0)), var(--accent);
      box-shadow: 0 4px 16px rgba(0,102,204,0.35), inset 0 1px 0 rgba(255,255,255,0.35);
      transition: transform 0.28s cubic-bezier(0.4,0,0.2,1), width 0.28s ease, height 0.28s ease, opacity 0.2s ease;
      z-index: 0;
      pointer-events: none;
    }

    .day-btn {
      position: relative;
      z-index: 1;
      padding: 10px 0;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      color: var(--text-main);
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
      box-shadow: inset 0 1px 0 var(--glass-highlight);
      transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), color 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
    }
    .day-btn:active { transform: scale(0.93); }

    .day-btn.active {
      background: transparent !important;
      color: var(--accent-text) !important;
      border-color: transparent !important;
    }

    .day-btn.is-today::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      background-color: var(--accent);
      border-radius: 50%;
      z-index: 2;
    }
    .day-btn.active.is-today::after {
      background-color: var(--accent-text);
    }

    #scheduleContainer {
      transition: opacity 0.25s ease, transform 0.28s cubic-bezier(0.4,0,0.2,1);
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    #scheduleContainer.content-hidden {
      opacity: 0;
      transform: translateY(8px) scale(0.99);
    }

    .card {
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 10px;
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      color: var(--text-main);
      box-shadow: 0 8px 26px var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
      transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), box-shadow 0.3s ease, border-color 0.3s ease, background-color 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .card:active { transform: scale(0.99); }

    .card.current-active {
      border: 1.5px solid var(--highlight-border);
      background: linear-gradient(160deg, var(--highlight-bg), var(--glass-bg));
    }

    .lesson-progress-container {
      margin-top: 10px;
      background: var(--progress-bg);
      border-radius: 8px;
      height: 6px;
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .lesson-progress-bar {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.5s linear;
      border-radius: 8px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .para-num {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .time-badge {
      font-size: 0.78rem;
      background: var(--badge-bg);
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .subject-title {
      color: var(--text-main);
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 8px;
    }

    .meta-info {
      font-size: 0.85rem;
      line-height: 1.4;
      color: var(--text-muted);
    }

    .meta-info div {
      margin-top: 4px;
    }

    .meta-info strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .badge-type {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .type-1 { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .type-2 { background: transparent; color: #9333ea; border: 1px solid #9333ea; }
    .type-0 { background: transparent; color: #16a34a; border: 1px solid #16a34a; }

    .umkd-subject-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      box-shadow: 0 8px 22px var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
      transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), border-color 0.3s ease;
    }
    .umkd-subject-card:active { transform: scale(0.98); }

    .umkd-subject-card:hover {
      border-color: var(--accent);
    }

    .umkd-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      backdrop-filter: blur(16px) saturate(160%);
      border-radius: 12px;
      margin-top: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      transition: transform 0.2s cubic-bezier(0.4,0,0.2,1);
    }
    .umkd-item:active { transform: scale(0.97); }

    .back-btn {
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: transform 0.2s cubic-bezier(0.4,0,0.2,1);
    }
    .back-btn:active { transform: scale(0.94); }

    .empty-state {
      text-align: center;
      padding: 40px 10px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .day-off-card {
      text-align: center;
      padding: 24px 18px;
    }

    .day-off-emoji {
      font-size: 2.5rem;
      margin-bottom: 6px;
      line-height: 1;
    }

    .day-off-title {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .day-off-weather {
      min-height: 48px;
    }

    .day-off-weather-loading {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .day-off-weather-main {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .day-off-weather-emoji {
      font-size: 1.6rem;
    }

    .day-off-weather-temp {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .day-off-weather-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .day-off-weather-details {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .day-off-divider {
      height: 1px;
      background: var(--border-color);
      margin: 18px 0;
    }

    .day-off-hint {
      font-size: 0.9rem;
      color: var(--text-main);
      background: var(--badge-bg);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: left;
      line-height: 1.4;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>

<div class="modal-overlay" id="cityModal">
  <div class="modal-card">
    <div class="modal-title">Выберите ваш город</div>
    <select id="citySelect" class="modal-select">
      <option value="Актау">Актау</option>
      <option value="Актобе">Актобе</option>
      <option value="Алматы">Алматы</option>
      <option value="Астана">Астана</option>
      <option value="Атырау">Атырау</option>
      <option value="Жезказган">Жезказган</option>
      <option value="Караганда">Караганда</option>
      <option value="Кокшетау">Кокшетау</option>
      <option value="Костанай">Костанай</option>
      <option value="Конаев">Конаев</option>
      <option value="Кызылорда">Кызылорда</option>
      <option value="Павлодар" selected>Павлодар</option>
      <option value="Петропавловск">Петропавловск</option>
      <option value="Семей">Семей</option>
      <option value="Талдыкорган">Талдыкорган</option>
      <option value="Тараз">Тараз</option>
      <option value="Туркестан">Туркестан</option>
      <option value="Уральск">Уральск</option>
      <option value="Усть-Каменогорск">Усть-Каменогорск</option>
      <option value="Шымкент">Шымкент</option>
      <option value="Ұлытау">Ұлытау</option>
    </select>
    <div class="modal-buttons">
      <button class="modal-btn cancel" onclick="closeCityModal()">Отменить</button>

  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE_NAME = 'univer-pwa-v1';
      self.addEventListener('install', (e) => {
        self.skipWaiting();
      });
      self.addEventListener('activate', (e) => {
        e.waitUntil(clients.claim());
      });
      self.addEventListener('fetch', (e) => {
        e.respondWith(
          caches.match(e.request).then((cachedResponse) => {
            if (cachedResponse) {
              fetch(e.request).then((networkResponse) => {
                if (networkResponse && networkResponse.status === 200) {
                  caches.open(CACHE_NAME).then((cache) => cache.put(e.request, networkResponse));
                }
              }).catch(() => {});
              return cachedResponse;
            }
            return fetch(e.request).then((networkResponse) => {
              return caches.open(CACHE_NAME).then((cache) => {
                cache.put(e.request, networkResponse.clone());
                return networkResponse;
              });
            }).catch(() => {
              return caches.match('./');
            });
          })
        );
      });
    `;
    const swBlob = new Blob([swCode], { type: 'text/javascript' });
    const swUrl = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl).catch(err => console.log('SW error', err));
  }

  async function fetchWeather(location, timeoutMs = 8000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const response = await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${location.lat}&longitude=${location.lon}&current=temperature_2m,weather_code`,
        { signal: controller.signal }
      );
      if (!response.ok) throw new Error('bad status ' + response.status);
      return await response.json();
    } finally {
      clearTimeout(timer);
    }
  }

  function weatherEmoji(code) {
    if (code === 0) return '☀️';
    if (code >= 1 && code <= 3) return '⛅';
    if (code >= 45 && code <= 48) return '🌫';
    if (code >= 51 && code <= 67) return '🌧';
    if (code >= 71 && code <= 77) return '❄️';
    if (code >= 80 && code <= 82) return '🌦';
    if (code >= 95) return '⚡';
    return '🌤';
  }

  function weatherDescription(code) {
    const map = {
      0: 'Ясно', 1: 'Малооблачно', 2: 'Облачно с прояснениями', 3: 'Пасмурно',
      45: 'Туман', 48: 'Изморозь',
      51: 'Морось', 53: 'Морось', 55: 'Морось',
      61: 'Дождь', 63: 'Дождь', 65: 'Сильный дождь',
      71: 'Снег', 73: 'Снег', 75: 'Сильный снегопад',
      80: 'Ливень', 81: 'Ливень', 82: 'Сильный ливень',
      95: 'Гроза'
    };
    return map[code] || 'Погода';
  }

  // Detailed forecast used only on the "no classes today" screen — separate
  // from the small header widget's simple fetch, and cached for a few
  // minutes so flipping tabs doesn't hammer the API.
  async function fetchDayWeatherDetails(location, timeoutMs = 8000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${location.lat}&longitude=${location.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
      const response = await fetch(url, { signal: controller.signal });
      if (!response.ok) throw new Error('bad status ' + response.status);
      return await response.json();
    } finally {
      clearTimeout(timer);
    }
  }

  function renderDayOffWeatherHtml(data) {
    const target = document.getElementById('dayOffWeatherDetail');
    if (!target) return; // user already navigated away
    const cur = data.current;
    const emoji = weatherEmoji(cur.weather_code);
    const desc = weatherDescription(cur.weather_code);
    const temp = Math.round(cur.temperature_2m);
    const feels = Math.round(cur.apparent_temperature);
    const humidity = Math.round(cur.relative_humidity_2m);
    const wind = Math.round(cur.wind_speed_10m);
    const hasDaily = data.daily && data.daily.temperature_2m_max && data.daily.temperature_2m_min;
    const tMax = hasDaily ? Math.round(data.daily.temperature_2m_max[0]) : null;
    const tMin = hasDaily ? Math.round(data.daily.temperature_2m_min[0]) : null;
    const rangeHtml = (tMax !== null && tMin !== null)
      ? `<span>${tMin > 0 ? '+' + tMin : tMin}° / ${tMax > 0 ? '+' + tMax : tMax}°</span>`
      : '';
    target.innerHTML = `
      <div class="day-off-weather-main">
        <span class="day-off-weather-emoji">${emoji}</span>
        <span class="day-off-weather-temp">${temp > 0 ? '+' + temp : temp}°C</span>

        ${rangeHtml}
        <span>💧 ${humidity}%</span>
        <span>💨 ${wind} км/ч</span>
      </div>
    `;
  }

  async function fillDayOffWeather() {
    const el = document.getElementById('dayOffWeatherDetail');
    if (!el) return;
    let savedCity = localStorage.getItem('user_city');
    if (!savedCity || !CITY_COORDS[savedCity]) savedCity = 'Павлодар';

    const cacheFresh = dayOffWeatherCache.city === savedCity
      && (Date.now() - dayOffWeatherCache.timestamp) < 5 * 60 * 1000;
    if (cacheFresh) {
      renderDayOffWeatherHtml(dayOffWeatherCache.data);
      return;
    }

    try {
      const data = await fetchDayWeatherDetails(CITY_COORDS[savedCity]);
      dayOffWeatherCache = { city: savedCity, data, timestamp: Date.now() };
      renderDayOffWeatherHtml(data);
    } catch (e) {
      const stillThere = document.getElementById('dayOffWeatherDetail');
      if (stillThere) stillThere.innerHTML = '🌡 Не удалось загрузить погоду';
    }
  }

  async function loadWeather(isRetry) {
    const weatherEl = document.getElementById('weatherWidget');
    let savedCity = localStorage.getItem('user_city');
    if (!savedCity || !CITY_COORDS[savedCity]) {
      savedCity = 'Павлодар';
      localStorage.setItem('user_city', savedCity);
    }

    if (!isRetry) weatherEl.innerHTML = '🌤 Загрузка...';
    const location = CITY_COORDS[savedCity];

    try {
      const data = await fetchWeather(location);
      const temp = Math.round(data.current.temperature_2m);
      const emoji = weatherEmoji(data.current.weather_code);
      weatherEl.innerHTML = `${emoji} ${temp > 0 ? '+' + temp : temp}°C`;
    } catch (e) {
      if (!isRetry) {
        // one silent automatic retry after a short pause — covers a flaky
        // connection or a slow first request without bothering the user
        setTimeout(() => loadWeather(true), 4000);
        weatherEl.innerHTML = '🌡 ...';
      } else {
        weatherEl.innerHTML = '🌡 —';
      }
    }
  }

  function swapContent(container, html, animate = true, onInserted) {
    if (!animate) {
      container.innerHTML = html;
      if (onInserted) onInserted();
      return;
    }
    container.classList.add('content-hidden');
    setTimeout(() => {
      container.innerHTML = html;
      requestAnimationFrame(() => {
        container.classList.remove('content-hidden');

      if (onInserted) onInserted();
    }, 160);
  }

  function getWeekType(date = new Date()) {
    const target = new Date(date.valueOf());
    const dayNr = (date.getDay() + 6) % 7;
    target.setDate(target.getDate() - dayNr + 3);
    const firstThursday = target.valueOf();
    target.setMonth(0, 1);
    if (target.getDay() !== 4) {
      target.setMonth(0, 1 + ((4 - target.getDay() + 7) % 7));
    }
    const weekNumber = 1 + Math.round((firstThursday - target) / 604800000);
    return (weekNumber % 2 !== 0) ? 1 : 2;
  }

  const LESSON_TIMES = {
    '1': { start: '09:00', end: '10:45' },
    '2': { start: '10:55', end: '12:40' },
    '3': { start: '13:10', end: '14:55' },
    '4': { start: '15:05', end: '16:50' },
    '5': { start: '17:00', end: '18:45' }
  };

  function getTime(paraNum) {
    const t = LESSON_TIMES[paraNum];
    return t ? `${t.start} - ${t.end}` : 'Время неизвестно';
  }

  function timeToMins(timeStr) {
    const [h, m] = timeStr.split(':').map(Number);
    return h * 60 + m;
  }

  // A day "has classes" if it's a key in SCHEDULE with at least one entry.
  // Fri/Sat/Sun aren't keys in SCHEDULE at all, so they naturally fall back
  // to the "day off" screen just like any weekday with an empty list would.
  function dayHasClasses(dayName) {
    return Array.isArray(SCHEDULE[dayName]) && SCHEDULE[dayName].length > 0;
  }

  // Finds the date of the coming Monday (tomorrow if today is Sunday).
  function getNextMondayDate() {
    const d = new Date();
    const day = d.getDay(); // 0 = Sunday ... 6 = Saturday
    let diff = (8 - day) % 7;
    if (diff === 0) diff = 7;
    d.setDate(d.getDate() + diff);
    return d;
  }

  // Builds the "coming up" hint shown on the day-off screen: the first
  // lesson of the next Monday, worked out from that Monday's actual
  // числитель/знаменатель type rather than assuming it matches today's.
  function getUpcomingMondayHint() {
    const mondayDate = getNextMondayDate();
    const weekType = getWeekType(mondayDate);
    const lessons = (SCHEDULE['Понедельник'] || [])
      .filter(l => l.type === 0 || l.type === weekType)
      .slice()
      .sort((a, b) => parseInt(a.пара, 10) - parseInt(b.пара, 10));

    if (lessons.length === 0) {
      return 'На понедельник пар пока нет — можно отдыхать подольше 😌';
    }
    const first = lessons[0];
    const t = LESSON_TIMES[first.пара];
    const timeStr = t ? t.start : '?';
    return `Ближайшая пара — <strong>${first.sub}</strong>, ПН в ${timeStr}, каб. ${first.room}`;
  }

  function buildDayOffScreen() {
    const hint = getUpcomingMondayHint();
    return `
      <div class="card day-off-card">
        <div class="day-off-emoji">🎉</div>
        <div class="day-off-title">Сегодня без пар</div>
        <div class="day-off-weather" id="dayOffWeatherDetail">
          <span class="day-off-weather-loading">🌤 Погода загружается...</span>
        </div>
        <div class="day-off-divider"></div>
        <div class="day-off-hint">📌 ${hint}</div>
      </div>
    `;
  }

  let currentMode = 'current';
  let selectedDay = 'Понедельник';
  let selectedUmkdSubject = null;
  let realTodayName = 'Понедельник';

  const DAY_NAMES_BY_INDEX = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];

  function detectToday() {
    realTodayName = DAY_NAMES_BY_INDEX[new Date().getDay()];
    // All 7 days now have their own button, so the initially selected day
    // is simply whatever day it really is today.
    selectedDay = realTodayName;

    const shortName = getShortDayName(realTodayName);
    if (shortName) {
      const todayBtnEl = document.getElementById(`btn-${shortName}`);
      if (todayBtnEl) todayBtnEl.classList.add('is-today');
    }
  }

  function getShortDayName(fullDay) {
    const shortNames = {
      'Понедельник': 'ПН',
      'Вторник': 'ВТ',
      'Среда': 'СР',
      'Четверг': 'ЧТ',
      'Пятница': 'ПТ',
      'Суббота': 'СБ',
      'Воскресенье': 'ВС'
    };
    return shortNames[fullDay] || null;
  }

  function updateStatusBarAndLive() {
    const currentWeekType = getWeekType();
    const currentWeekName = currentWeekType === 1 ? "Числитель ⚡" : "Знаменатель 🌙";
    const statusText = document.getElementById('weekStatusText');
    const badgeEl = document.getElementById('liveLessonBadge');
    const todayBtn = document.getElementById('todayBtn');

    if (selectedDay !== realTodayName || currentMode !== 'current') {
      todayBtn.style.display = 'flex';
    } else {
      todayBtn.style.display = 'none';
    }

    if (currentMode === 'current') {
      statusText.innerHTML = `Текущая: <b>${currentWeekName}</b>`;
    } else if (currentMode === 'next') {
      const nextWeekName = currentWeekType === 1 ? "Знаменатель 🌙" : "Числитель ⚡";
      statusText.innerHTML = `След: <b>${nextWeekName}</b>`;
    } else if (currentMode === 'exams') {
      statusText.innerHTML = `📌 <b>Экзамены</b>`;
    } else {
      statusText.innerHTML = `📁 <b>УМКД</b>`;
    }

    if (!dayHasClasses(realTodayName)) {
      badgeEl.innerHTML = '🌴 Сегодня без пар';
      return;
    }

    const now = new Date();
    const currentMins = now.getHours() * 60 + now.getMinutes();
    const currentWeekTypeForToday = getWeekType();

    const dayLessons = SCHEDULE[realTodayName] || [];
    const activeLessons = dayLessons.filter(l => l.type === 0 || l.type === currentWeekTypeForToday);

    let currentParaNum = null;
    let nextParaInfo = null;

    for (const item of activeLessons) {
      const t = LESSON_TIMES[item.пара];
      if (!t) continue;
      const startMins = timeToMins(t.start);
      const endMins = timeToMins(t.end);

      if (currentMins >= startMins && currentMins <= endMins) {
        currentParaNum = item.пара;
        break;
      } else if (currentMins < startMins) {
        if (!nextParaInfo) {
          nextParaInfo = { num: item.пара, start: t.start };
        }
      }
    }

    if (currentParaNum) {
      const t = LESSON_TIMES[currentParaNum];
      const endMins = timeToMins(t.end);
      const leftMins = endMins - currentMins;
      badgeEl.innerHTML = `🔥 Идет пара №${currentParaNum} (еще ${leftMins} мин)`;
    } else if (nextParaInfo) {
      badgeEl.innerHTML = `⏳ Следующая: пара №${nextParaInfo.num} в ${nextParaInfo.start}`;
    } else if (activeLessons.length === 0) {
      badgeEl.innerHTML = `🌴 Сегодня без пар`;
    } else {
      badgeEl.innerHTML = `🎉 Пары на сегодня всё`;
    }
  }

  function jumpToToday() {
    haptic('light');
    switchWeek('current');
    selectDay(realTodayName, null);
  }

  function switchWeek(mode) {
    if (mode !== currentMode) haptic('light');
    currentMode = mode;
    selectedUmkdSubject = null;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if (mode === 'current') document.getElementById('tabCurrent').classList.add('active');
    if (mode === 'next') document.getElementById('tabNext').classList.add('active');
    if (mode === 'exams') document.getElementById('tabExams').classList.add('active');
    if (mode === 'umkd') document.getElementById('tabUmkd').classList.add('active');
    updateTabIndicator();

    const daysGrid = document.getElementById('daysGrid');
    if (mode === 'exams' || mode === 'umkd') {
      daysGrid.style.display = 'none';
      if (mode === 'exams') renderExams();
      if (mode === 'umkd') renderUmkdSubjects();
    } else {
      daysGrid.style.display = 'grid';
      renderSchedule();
    }
    updateDayIndicator();
    updateStatusBarAndLive();
  }

  function selectDay(dayName, btnElement) {
    if (dayName !== selectedDay) haptic('light');
    selectedDay = dayName;
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    if (btnElement) {
      btnElement.classList.add('active');
    } else {
      const shortName = getShortDayName(dayName);
      const targetBtn = shortName ? document.getElementById(`btn-${shortName}`) : null;
      if (targetBtn) targetBtn.classList.add('active');
    }
    updateDayIndicator();
    renderSchedule();
    updateStatusBarAndLive();
  }

  function renderSchedule(animate = true) {
    const container = document.getElementById('scheduleContainer');
    const currentWeekType = getWeekType();
    let targetWeek = currentMode === 'next' ? (currentWeekType === 1 ? 2 : 1) : currentWeekType;

    const dayLessons = SCHEDULE[selectedDay] || [];
    const filteredLessons = dayLessons.filter(l => l.type === 0 || l.type === targetWeek);

    if (filteredLessons.length === 0) {
      const isDayOff = !dayHasClasses(selectedDay);
      const html = isDayOff
        ? buildDayOffScreen()
        : '<div class="empty-state">🎉 На этот день пар нет!</div>';
      swapContent(container, html, animate, isDayOff ? fillDayOffWeather : null);
      return;
    }

    const now = new Date();
    const currentMins = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    let activeParaNow = null;
    let progressPercent = 0;

    const showLiveProgress = currentMode === 'current' && selectedDay === realTodayName && dayHasClasses(realTodayName);
    if (showLiveProgress) {
      for (const item of filteredLessons) {
        const t = LESSON_TIMES[item.пара];
        if (t) {
          const startMins = timeToMins(t.start);
          const endMins = timeToMins(t.end);
          if (currentMins >= startMins && currentMins <= endMins) {
            activeParaNow = item.пара;
            const totalDuration = endMins - startMins;
            const elapsed = currentMins - startMins;
            progressPercent = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));
            break;
          }
        }
      }
    }

    let html = '';
    filteredLessons.forEach(item => {
      let typeBadge = '';
      if (item.type === 1) typeBadge = '<span class="badge-type type-1">Числитель</span>';
      else if (item.type === 2) typeBadge = '<span class="badge-type type-2">Знаменатель</span>';
      else typeBadge = '<span class="badge-type type-0">Каждую неделю</span>';

      const isActive = (item.пара === activeParaNow);
      const cardClass = isActive ? 'card current-active' : 'card';

      let progressBarHtml = '';
      if (isActive) {
        progressBarHtml = `
          <div class="lesson-progress-container">
            <div class="lesson-progress-bar" style="width: ${progressPercent}%"></div>
          </div>
        `;
      }

      html += `
        <div class="${cardClass}">
          <div class="card-header">
            <span class="para-num">Пара №${item.пара} ${isActive ? '⚡ (Идет сейчас)' : ''}</span>
            <span class="time-badge">🕐 ${getTime(item.пара)}</span>
          </div>
          <div class="subject-title">${item.sub}</div>
          <div class="meta-info">
            <div>👩‍🏫 ${item.teacher}</div>
            <div>🚪 Кабинет: <strong>${item.room}</strong></div>
            <div>${typeBadge}</div>
          </div>
          ${progressBarHtml}
        </div>
      `;
    });
    swapContent(container, html, animate);
  }

  function renderExams() {
    const container = document.getElementById('scheduleContainer');
    let html = '';
    EXAMS.forEach(exam => {
      html += `
        <div class="card" style="border-left: 3px solid var(--accent);">
          <div class="card-header">
            <span class="para-num">📅 ${exam.date}</span>
            <span class="time-badge">🕐 ${exam.time}</span>
          </div>
          <div class="subject-title">${exam.sub}</div>
          <div class="meta-info">
            <div>👨‍🏫 Препод: ${exam.teacher}</div>
            <div>📍 Локация: <strong>${exam.room}</strong></div>
          </div>
        </div>
      `;
    });
    swapContent(container, html);
  }

  function renderUmkdSubjects() {
    const container = document.getElementById('scheduleContainer');
    let html = '';

    for (const subject of Object.keys(UMKD_FILES)) {
      html += `
        <div class="umkd-subject-card" onclick="selectUmkdSubject('${subject.replace(/'/g, "\\'")}')">
          <span>📚 ${subject}</span>
          <span style="color: var(--text-muted); font-weight: normal; font-size: 0.85rem;">Открыть ➔</span>
        </div>
      `;
    }
    swapContent(container, html);
  }

  function selectUmkdSubject(subjectName) {
    haptic('light');
    selectedUmkdSubject = subjectName;
    const container = document.getElementById('scheduleContainer');
    const files = UMKD_FILES[subjectName] || [];

    let filesHtml = '';
    files.forEach(file => {
      filesHtml += `
        <div class="umkd-item" onclick="openPdf('${file.name}', '${file.url}')">
          <span>${file.name}</span>
          <span>📂 Открыть PDF</span>
        </div>
      `;
    });

    const html = `
      <button class="back-btn" style="margin-bottom: 12px; padding: 8px 14px;" onclick="renderUmkdSubjects()">← Назад к списку дисциплин</button>
      <div class="card">
        <div class="subject-title" style="font-size: 1.05rem; margin-bottom: 10px;">📚 ${subjectName}</div>
        <div style="margin-top: 8px;">
          ${filesHtml}
        </div>
      </div>
    `;
    swapContent(container, html);
  }

  document.addEventListener('DOMContentLoaded', () => {
    applyTimeOfDayAmbient();
    detectToday();
    updateStatusBarAndLive();
    selectDay(selectedDay, null);
    loadWeather();
    initIndicatorsNoAnim();

    // Recheck the time-of-day palette every 5 minutes — cheap and keeps the
    // ambient glass tint in sync without touching the 1s schedule timer.
    setInterval(applyTimeOfDayAmbient, 5 * 60 * 1000);

    setInterval(() => {
      updateStatusBarAndLive();
      if (currentMode === 'current' && dayHasClasses(selectedDay)) {
        renderSchedule(false);
      }
    }, 1000);
  });
</script>
</body>
</html>
